name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Relay simulation (multi-hop, dedup, TTL)
        if: hashFiles('Tests/RelaySimulation/main.swift') != ''
        run: |
          xcrun swiftc -O DistrictMesh/Models/MeshRelayPacket.swift Tests/RelaySimulation/main.swift -o relay-sim
          ./relay-sim

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project DistrictMesh.xcodeproj -scheme DistrictMesh -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package unsigned IPA (for Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project DistrictMesh.xcodeproj -scheme DistrictMesh -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/DistrictMesh.app Payload/
          zip -qry DistrictMesh-unsigned.ipa Payload
          ls -lh DistrictMesh-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DistrictMesh-unsigned-ipa
          path: DistrictMesh-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  simulator-mesh:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project DistrictMesh.xcodeproj -scheme DistrictMesh -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
      - name: Four-simulator mesh test
        run: bash Tests/sim-mesh-test.sh dd/Build/Products/Debug-iphonesimulator/DistrictMesh.app sim-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-mesh
          path: sim-out
